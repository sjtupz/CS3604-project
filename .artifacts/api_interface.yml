- type: Backend
  id: API-GET-Stations
  route: GET /api/stations
  description: 获取所有火车站的列表，用于前端输入框的推荐功能。
  input:
    type: QueryParams
    params:
      search: string (optional)
  output:
    success:
      statusCode: 200
      body:
        - name: "北京南"
          pinyin: "beijingnan"
        - name: "上海虹桥"
          pinyin: "shanghaihongqiao"
    error:
      - statusCode: 500
        body: { error: "Internal Server Error" }
  dependencies:
    - DB-FindAllStations
  acceptanceCriteria:
    - 当不带search参数调用时，返回所有站点列表。
    - 当带search参数调用时，返回与输入匹配的站点列表。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Trains
  route: GET /api/trains
  description: 获取车次列表（分页），支持多条件筛选与鉴权。
  version: v1
  auth: JWT
  input:
    type: QueryParams
    params:
      from: string
      to: string
      date: string
      trainTypes: string (optional, values: GC,D,Z)
      departureStation: string (optional)
      arrivalStation: string (optional)
      seatTypes: string (optional, comma separated)
      departureTimeStart: string (optional, format: HH:mm)
      departureTimeEnd: string (optional, format: HH:mm)
      passengerCategory: string (optional, values: normal,student)
      sortBy: string (optional, values: trainNumber,departureTime,arrivalTime,duration)
      sortOrder: string (optional, values: asc,desc)
      page: number (optional, default: 1)
      pageSize: number (optional, default: 20)
  output:
    success:
      statusCode: 200
      body:
        code: 200
        data:
          items:
            - trainNumber: "G108"
              departureStation: "上海虹桥"
              arrivalStation: "北京南"
              departureTime: "08:00"
              arrivalTime: "12:30"
              duration: "4h30m"
              arrivalDayIndicator: "当日到达"
              seatAvailability:
                一等座: { remaining: 12 }
                二等座: { remaining: 0, backupOnly: true }
                软卧: { remaining: null, hasSeatType: false }
          pagination:
            total: 100
            currentPage: 1
            perPage: 20
            totalPages: 5
    error:
      - statusCode: 400
        body: { code: 40001, message: "参数不合法" }
      - statusCode: 401
        body: { code: 40100, message: "未授权" }
      - statusCode: 500
        body: { code: 50001, message: "查询失败，请稍后重试" }
  errorCodes:
    - code: 40001
      message: 参数不合法
    - code: 40100
      message: 未授权
    - code: 50001
      message: 查询失败，请稍后重试
  dependencies:
    - DB-FindTrains
    - DB-GetRemainingTickets
    - DB-CreateIndexes-Trains
    - DB-Cache-TrainsQueryResults
  acceptanceCriteria:
    - 缺少必填参数返回40001；鉴权失败返回40100。
    - 默认分页每页20条；返回包含total/currentPage/perPage/totalPages的分页元数据。
    - 支持多条件组合筛选（AND逻辑）。
    - 支持排序字段与方向；当排序参数非法时返回40001。
    - P99响应时间≤500ms；命中缓存时优先返回缓存。
  curlExamples:
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains?from=上海&to=北京&date=2025-12-25&page=1&pageSize=20&sortBy=departureTime&sortOrder=asc\""
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains?from=上海&to=北京&date=2025-12-25&trainTypes=GC&departureTimeStart=06:00&departureTimeEnd=12:00&passengerCategory=student\""
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"
    - date: "2025-12-07"
      description: "重构为分页 envelope 响应，增加筛选与JWT鉴权。"
    - date: "2025-12-07"
      description: "新增乘客类别与排序参数。"

- type: Backend
  id: API-GET-CheckUsername
  route: GET /api/users/check-username
  description: 检查用户名是否已被占用。
  input:
    type: QueryParams
    params:
      username: string
  output:
    success:
      statusCode: 200
      body: { isAvailable: true }
    error:
      - statusCode: 200
        body: { isAvailable: false, message: "该用户名已经占用，请重新选择用户名！" }
      - statusCode: 400
        body: { error: "Invalid username format." }
  dependencies:
    - DB-FindUserByUsername
  acceptanceCriteria:
    - 当用户名可用时，返回 isAvailable: true。
    - 当用户名已被占用时，返回 isAvailable: false。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于注册表单的实时用户名校验。"

- type: Backend
  id: API-POST-Register
  route: POST /api/auth/register
  description: 处理用户注册请求。
  input:
    type: JSON
    body:
      username: string
      password: string
      identityType: string
      fullName: string
      identityNumber: string
      passengerType: string
      email: string (optional)
      phoneNumber: string
  output:
    success:
      statusCode: 201
      body: { message: "Registration successful, please proceed to login." }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 409
        body: { error: "Username, identity, email, or phone number already exists." }
  dependencies:
    - DB-FindUserByUsername
    - DB-FindUserByIdentity
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-CreateUser
  acceptanceCriteria:
    - 通常在验证码校验成功后执行，创建新用户并返回 201 Created。
    - 当用户名、证件、邮箱或手机号已存在时，应返回 409 Conflict 及具体错误信息。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于处理用户注册流程。"
    - date: "2025-12-01"
      description: "更新验收标准以配合验证码页流程。"

- type: Backend
  id: API-POST-Login-SendCode
  route: POST /api/auth/login/send-code
  description: 发送登录短信验证码到用户绑定的手机号。
  input:
    type: JSON
    body:
      identifier: string
      idLast4: string
  output:
    success:
      statusCode: 200
      body: { message: "获取手机验证码成功！" }
    error:
      - statusCode: 404
        body: { error: "请输入正确的用户信息！" }
      - statusCode: 422
        body: { error: "请输入正确的用户信息！" }
      - statusCode: 429
        body: { error: "操作过于频繁，请稍后再试。" }
  dependencies:
    - DB-FindUserByUsername
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-CreateLoginCodeRecord
  acceptanceCriteria:
    - 根据 identifier 判断类型（手机号、邮箱或用户名）。
    - 当用户不存在或证件后4位不匹配时，返回错误“请输入正确的用户信息！”。
    - 匹配成功时生成并发送6位验证码到用户绑定手机号，并记录在数据库。
  changeLog:
    - date: "2025-11-24"
      description: "依据登录页短信验证码流程新增。"

- type: Backend
  id: API-POST-Login-Verify
  route: POST /api/auth/login/verify
  description: 校验短信验证码并验证密码，登录成功返回用户信息。
  input:
    type: JSON
    body:
      identifier: string
      idLast4: string
      code: string
      password: string
  output:
    success:
      statusCode: 200
      body: { userId: "uuid", token: "jwt" }
    error:
      - statusCode: 400
        body: { error: "请输入验证码" }
      - statusCode: 401
        body: { error: "验证码校验失败" }
      - statusCode: 403
        body: { error: "用户名或密码错误" }
  dependencies:
    - DB-FindUserByUsername
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-FindLoginCodeRecord
    - DB-InvalidateLoginCodeRecord
  acceptanceCriteria:
    - 验证码错误或未发送时，返回“验证码校验失败”。
    - 验证码正确后验证密码，不匹配返回“用户名或密码错误”。
    - 校验成功后返回 200，并包含 token 与 userId；验证码应作废。
  changeLog:
    - date: "2025-11-24"
      description: "依据登录页短信验证提交流程新增。"
- type: Backend
  id: API-POST-Register-SendCode
  route: POST /api/auth/register/send-code
  description: 在进入验证码输入页时（或用户点击重新发送）向注册手机号发送6位验证码并记录。
  input:
    type: JSON
    body:
      phoneNumber: string
  output:
    success:
      statusCode: 200
      body: { message: "获取手机验证码成功！" }
    error:
      - statusCode: 422
        body: { error: "请输入正确的用户信息！" }
      - statusCode: 429
        body: { error: "操作过于频繁，请稍后再试。" }
  dependencies:
    - DB-CreateLoginCodeRecord
  acceptanceCriteria:
    - 当传入合法手机号时，生成并发送6位验证码，保存到数据库并返回成功消息。
    - 返回消息用于页面显示与倒计时提示；服务端应具备频控以防滥发。
  changeLog:
    - date: "2025-12-01"
      description: "新增，以满足注册验证码页的自动发送与重新发送需求。"

- type: Backend
  id: API-POST-Register-Verify
  route: POST /api/auth/register/verify
  description: 校验注册短信验证码并在成功后创建用户。
  input:
    type: JSON
    body:
      phoneNumber: string
      code: string
      username: string
      password: string
      identityType: string
      fullName: string
      identityNumber: string
      passengerType: string
      email: string (optional)
  output:
    success:
      statusCode: 201
      body: { message: "Registration successful, please proceed to login." }
    error:
      - statusCode: 400
        body: { error: "请输入验证码" }
      - statusCode: 401
        body: { error: "验证码校验失败" }
      - statusCode: 409
        body: { error: "Username, identity, email, or phone number already exists." }
  dependencies:
    - DB-FindLoginCodeRecord
    - DB-InvalidateLoginCodeRecord
    - DB-FindUserByUsername
    - DB-FindUserByIdentity
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-CreateUser
  acceptanceCriteria:
    - 未填写或验证码不匹配时返回相应错误；验证成功后创建用户并返回 201。
    - 验证码使用后应作废，不允许重复使用。
  changeLog:
    - date: "2025-12-01"
      description: "新增，以满足注册验证码页的校验与最终注册。"
- type: Backend
  id: API-GET-Trains-Search
  route: GET /api/trains/search
  description: 根据车次号与出发时间范围进行精确搜索，支持分页与鉴权。
  version: v1
  auth: JWT
  input:
    type: QueryParams
    params:
      trainNumber: string (optional, exact match)
      departureTimeStart: string (optional, format: HH:mm)
      departureTimeEnd: string (optional, format: HH:mm)
      from: string (optional)
      to: string (optional)
      date: string (optional)
      sortBy: string (optional, values: trainNumber,departureTime,arrivalTime,duration)
      sortOrder: string (optional, values: asc,desc)
      page: number (optional, default: 1)
      pageSize: number (optional, default: 20)
  output:
    success:
      statusCode: 200
      body:
        code: 200
        data:
          items:
            - trainNumber: "G108"
              departureStation: "上海虹桥"
              arrivalStation: "北京南"
              departureTime: "08:00"
              arrivalTime: "12:30"
              duration: "4h30m"
          pagination:
            total: 2
            currentPage: 1
            perPage: 20
            totalPages: 1
    error:
      - statusCode: 400
        body: { code: 40002, message: "查询条件不合法" }
      - statusCode: 401
        body: { code: 40100, message: "未授权" }
      - statusCode: 500
        body: { code: 50002, message: "搜索失败，请稍后重试" }
  errorCodes:
    - code: 40002
      message: 查询条件不合法
    - code: 40100
      message: 未授权
    - code: 50002
      message: 搜索失败，请稍后重试
  dependencies:
    - DB-FindTrains
    - DB-CreateIndexes-Trains
    - DB-Cache-TrainsQueryResults
  acceptanceCriteria:
    - trainNumber为精确匹配；时间范围支持HH:mm格式，start≤end。
    - 支持多个条件组合（AND），均为可选；缺少全部条件仍允许返回分页结果。
    - 默认每页20条；返回分页元数据；支持排序；P99≤500ms。
  curlExamples:
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains/search?trainNumber=G108&page=1&pageSize=20&sortBy=departureTime&sortOrder=asc\""
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains/search?departureTimeStart=06:00&departureTimeEnd=12:00\""
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足精确搜索与时间范围筛选需求。"
    - date: "2025-12-07"
      description: "新增排序参数。"

- type: Backend
  id: API-GET-Train-Schedule
  route: GET /api/trains/{trainNumber}/schedule
  description: 获取指定车次的全量站序时刻表。
  version: v1
  auth: JWT
  input:
    type: PathAndQuery
    params:
      trainNumber: string (path)
      date: string (optional)
  output:
    success:
      statusCode: 200
      body:
        code: 200
        data:
          stationSchedules:
            - stationId: "uuid"
              stationName: "上海虹桥"
              arrivalTime: "2025-12-25T07:55:00+08:00"
              departureTime: "2025-12-25T08:00:00+08:00"
              segmentId: "uuid"
              dwellMinutes: 5
    error:
      - statusCode: 404
        body: { code: 40401, message: "车次不存在" }
      - statusCode: 500
        body: { code: 50003, message: "时刻表获取失败，请稍后重试" }
  errorCodes:
    - code: 40401
      message: 车次不存在
    - code: 50003
      message: 时刻表获取失败，请稍后重试
  dependencies:
    - DB-GetTrainSchedule
  acceptanceCriteria:
    - 当车次不存在时返回40401；存在时返回完整站序时刻表。
    - date为空返回最新版本；响应结构与示例一致。
  curlExamples:
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains/G108/schedule\""
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains/G108/schedule?date=2025-12-25\""
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足时刻表展示需求。"

- type: Backend
  id: API-GET-Stations-Groups
