- type: Backend
  id: API-GET-Stations
  route: GET /api/stations
  description: 获取所有火车站的列表，用于前端输入框的推荐功能。
  input:
    type: QueryParams
    params:
      search: string (optional)
  output:
    success:
      statusCode: 200
      body:
        - name: "北京南"
          pinyin: "beijingnan"
        - name: "上海虹桥"
          pinyin: "shanghaihongqiao"
    error:
      - statusCode: 500
        body: { error: "Internal Server Error" }
  dependencies:
    - DB-FindAllStations
  acceptanceCriteria:
    - 当不带search参数调用时，返回所有站点列表。
    - 当带search参数调用时，返回与输入匹配的站点列表。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-Trains
  route: GET /api/trains
  description: 根据查询条件搜索车次。
  input:
    type: QueryParams
    params:
      from: string
      to: string
      date: string
      isHighSpeed: boolean
  output:
    success:
      statusCode: 200
      body: 
        - trainNumber: "G1"
          departureTime: "08:00"
          arrivalTime: "12:30"
          duration: "4h30m"
    error:
      - statusCode: 400
        body: { error: "Invalid input parameters." }
      - statusCode: 500
        body: { error: "Query failed, please try again later." }
  dependencies:
    - DB-FindTrains
  acceptanceCriteria:
    - 当提供所有必需参数时，返回匹配的车次列表。
    - 当缺少必需参数时，返回 400 Bad Request。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Backend
  id: API-GET-CheckUsername
  route: GET /api/users/check-username
  description: 检查用户名是否已被占用。
  input:
    type: QueryParams
    params:
      username: string
  output:
    success:
      statusCode: 200
      body: { isAvailable: true }
    error:
      - statusCode: 200
        body: { isAvailable: false, message: "该用户名已经占用，请重新选择用户名！" }
      - statusCode: 400
        body: { error: "Invalid username format." }
  dependencies:
    - DB-FindUserByUsername
  acceptanceCriteria:
    - 当用户名可用时，返回 isAvailable: true。
    - 当用户名已被占用时，返回 isAvailable: false。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于注册表单的实时用户名校验。"

- type: Backend
  id: API-POST-Register
  route: POST /api/auth/register
  description: 处理用户注册请求。
  input:
    type: JSON
    body:
      username: string
      password: string
      identityType: string
      fullName: string
      identityNumber: string
      passengerType: string
      email: string (optional)
      phoneNumber: string
  output:
    success:
      statusCode: 201
      body: { message: "Registration successful, please proceed to login." }
    error:
      - statusCode: 400
        body: { error: "Invalid input or format." }
      - statusCode: 409
        body: { error: "Username, identity, email, or phone number already exists." }
  dependencies:
    - DB-FindUserByUsername
    - DB-FindUserByIdentity
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-CreateUser
  acceptanceCriteria:
    - 当接收到合法且未注册的数据时，应创建新用户并返回 201 Created。
    - 当用户名、证件、邮箱或手机号已存在时，应返回 409 Conflict 及具体错误信息。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于处理用户注册流程。"

- type: Backend
  id: API-POST-Login-SendCode
  route: POST /api/auth/login/send-code
  description: 发送登录短信验证码到用户绑定的手机号。
  input:
    type: JSON
    body:
      identifier: string
      idLast4: string
  output:
    success:
      statusCode: 200
      body: { message: "获取手机验证码成功！" }
    error:
      - statusCode: 404
        body: { error: "请输入正确的用户信息！" }
      - statusCode: 422
        body: { error: "请输入正确的用户信息！" }
      - statusCode: 429
        body: { error: "操作过于频繁，请稍后再试。" }
  dependencies:
    - DB-FindUserByUsername
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-CreateLoginCodeRecord
  acceptanceCriteria:
    - 根据 identifier 判断类型（手机号、邮箱或用户名）。
    - 当用户不存在或证件后4位不匹配时，返回错误“请输入正确的用户信息！”。
    - 匹配成功时生成并发送6位验证码到用户绑定手机号，并记录在数据库。
  changeLog:
    - date: "2025-11-24"
      description: "依据登录页短信验证码流程新增。"

- type: Backend
  id: API-POST-Login-Verify
  route: POST /api/auth/login/verify
  description: 校验短信验证码并验证密码，登录成功返回用户信息。
  input:
    type: JSON
    body:
      identifier: string
      idLast4: string
      code: string
      password: string
  output:
    success:
      statusCode: 200
      body: { userId: "uuid", token: "jwt" }
    error:
      - statusCode: 400
        body: { error: "请输入验证码" }
      - statusCode: 401
        body: { error: "验证码校验失败" }
      - statusCode: 403
        body: { error: "用户名或密码错误" }
  dependencies:
    - DB-FindUserByUsername
    - DB-FindUserByEmail
    - DB-FindUserByPhone
    - DB-FindLoginCodeRecord
    - DB-InvalidateLoginCodeRecord
  acceptanceCriteria:
    - 验证码错误或未发送时，返回“验证码校验失败”。
    - 验证码正确后验证密码，不匹配返回“用户名或密码错误”。
    - 校验成功后返回 200，并包含 token 与 userId；验证码应作废。
  changeLog:
    - date: "2025-11-24"
      description: "依据登录页短信验证提交流程新增。"
