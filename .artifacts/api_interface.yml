- type: Backend
  id: API-GET-Trains-RoundTrip
  route: GET /api/trains/round-trip
  description: 同时查询去程与返程车次列表，支持分页与筛选。
  version: v1
  auth: JWT
  input:
    type: QueryParams
    params:
      from: string
      to: string
      departDate: string
      returnDate: string
      trainTypes: string (optional)
      seatTypes: string (optional)
      departureTimeStart: string (optional)
      departureTimeEnd: string (optional)
      passengerCategory: string (optional, values: normal,student)
      sortBy: string (optional)
      sortOrder: string (optional)
      page: number (optional, default: 1)
      pageSize: number (optional, default: 20)
  output:
    success:
      statusCode: 200
      body:
        code: 200
        data:
          outbound:
            items: []
            pagination: { total: 0, currentPage: 1, perPage: 20, totalPages: 0 }
          return:
            items: []
            pagination: { total: 0, currentPage: 1, perPage: 20, totalPages: 0 }
    error:
      - statusCode: 400
        body: { code: 40003, message: "去程/返程参数不合法或缺失" }
      - statusCode: 401
        body: { code: 40100, message: "未授权" }
      - statusCode: 500
        body: { code: 50005, message: "双程查询失败" }
  errorCodes:
    - code: 40003
      message: 去程/返程参数不合法或缺失
    - code: 50005
      message: 双程查询失败
  dependencies:
    - DB-FindTrainsRoundTrip
    - DB-CreateIndexes-Trains
    - DB-Cache-TrainsQueryResults
  acceptanceCriteria:
    - 同时返回去程与返程两个集合，各含分页元数据；参数缺失返回40003。
    - 支持排序与乘客类别筛选；P99≤500ms。
  curlExamples:
    - "curl -H 'Authorization: Bearer <JWT>' \"http://localhost:3000/api/trains/round-trip?from=上海&to=北京&departDate=2025-12-25&returnDate=2025-12-26\""
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足双程查询场景。"
