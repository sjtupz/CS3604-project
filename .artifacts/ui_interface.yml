- type: Frontend
  id: UI-TrainListPage
  description: 车次列表页，包含顶部导航栏、查询栏、详细信息选择区、车次信息展示区与底部导航栏。
  properties: []
  state:
    - isLoggedIn
    - tripType
    - passengerCategory
    - fromStation
    - toStation
    - departureDate
    - returnDate
    - selectedDate
    - filters
    - trains
    - pagination
    - isLoading
    - error
  dependencies:
    - UI-TopNavigationBar
    - UI-QuickAccessMenu
    - UI-TicketQueryForm
    - UI-TrainFilterBar
    - UI-TrainFilterPanel
    - UI-TrainList
    - UI-Pagination
    - UI-RoundTripToggle
    - UI-PassengerCategoryToggle
    - API-GET-Trains
    - API-GET-Trains-RoundTrip
  acceptanceCriteria:
    - 页面自上而下包含五部分；背景为白色。
    - 初始进入时随机填充出发地与目的地，出发/返程为当前日期；默认模式为单程。
    - 出行信息不全时点击查询不展示车票且不报错；信息完整时展示当日两地间车票。
    - 在详细信息选择区选择任意筛选项后，下方车票信息立即更新，无需再次点击查询。
    - 点击上方日期或时间范围时，更新查询条件并刷新列表。
    - 点击“预定”按钮：未登录跳转登录页；已登录跳转订单填写页。
    - 切换为双程时，页面展示去程与返程两个列表，分别分页；单程展示单列表。
  responsive:
    breakpoints:
      - name: sm
        width: 576
      - name: md
        width: 768
      - name: lg
        width: 992
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足车次列表页整体布局与交互。"
    - date: "2025-12-07"
      description: "补充双程与乘客类别交互与接口依赖。"

