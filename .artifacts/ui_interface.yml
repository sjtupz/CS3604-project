- type: Frontend
  id: UI-TopNavigationBar
  description: 网站的顶部导航栏，包含Logo、搜索框和用户操作入口。
  properties: []
  state:
    - isLoggedIn
  dependencies:
    - UI-LoginForm
    - UI-RegisterForm
    - UI-PersonalCenterPage
  acceptanceCriteria:
    - 点击Logo应跳转到首页。
    - 未登录时，点击“我的12306”或“登录”应跳转到登录页。
    - 点击“注册”应跳转到注册页。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Frontend
  id: UI-QuickAccessMenu
  description: 常用功能快捷入口菜单。
  properties: []
  state: []
  dependencies:
    - UI-TrainListPage
  acceptanceCriteria:
    - 点击“首页”应跳转到首页。
    - 点击“车票”应跳转到车次列表页。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Frontend
  id: UI-TicketQueryForm
  description: 用于查询车票的表单。
  properties: []
  state:
    - fromStation
    - toStation
    - departureDate
    - isHighSpeed
    - fromError
    - toError
    - dateError
    - isLoading
  dependencies:
    - API-GET-Stations
    - API-GET-Stations-Groups
    - API-GET-Trains
    - API-GET-Trains-RoundTrip
    - UI-RoundTripToggle
    - UI-PassengerCategoryToggle
    - UI-StationGroupSelector
    - UI-StationDropdown
    - UI-DatePicker
  acceptanceCriteria:
    - 用户未输入出发地、到达地或出发日期时，点击查询按钮应显示错误提示。
    - 选择“单程/双程”后，双程应开放并必填返程日；单程隐藏返程日。
    - 选择“普通/学生”后，应携带 passengerCategory 参数用于查询。
    - 用户输入合法信息并点击查询，应跳转到车次列表页并触发对应接口（单程调用 API-GET-Trains，双程调用 API-GET-Trains-RoundTrip）。
    - 点击出发地或到达地输入框时，应显示分组下拉（热门与字母分组），支持手写输入模糊搜索。
    - 点击日期输入框时，应显示日期选择器。
    - 点击交换按钮应交换出发地和到达地。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"
    - date: "2025-12-07"
      description: "新增单程/双程与普通/学生选择，接入分组站点与双程接口。"

- type: Frontend
  id: UI-StationDropdown
  description: 用于显示和选择站点的下拉列表。
  properties:
    - name: onSelectStation
      type: function
      description: "选择站点后的回调函数。"
  state:
    - stations
    - currentPage
    - searchTerm
  dependencies:
    - API-GET-Stations
  acceptanceCriteria:
    - 应能根据用户输入进行模糊查询和分页显示。
    - 选择一个站点后，应调用onSelectStation回调。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Frontend
  id: UI-DatePicker
  description: 日期选择器组件。
  properties:
    - name: onDateSelect
      type: function
      description: "选择日期后的回调函数。"
  state:
    - selectedDate
  dependencies: []
  acceptanceCriteria:
    - 用户只能选择从当前日期开始的未来日期。
    - 选择日期并确认后，应调用onDateSelect回调。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建。"

- type: Frontend
  id: UI-RegisterForm
  description: 一个完整的用户注册表单，处理用户输入、验证和提交。
  properties:
    - name: onRegisterSuccess
      type: function
      description: "注册成功后的回调函数。"
  state:
    - username
    - password
    - confirmPassword
    - identityType
    - fullName
    - identityNumber
    - passengerType
    - email
    - phoneNumber
    - agreeToTerms
    - errors
    - isLoading
  dependencies:
    - API-GET-CheckUsername
    - API-POST-Register-SendCode
    - UI-RegisterVerificationPage
  acceptanceCriteria:
    - 组件应渲染所有必需的输入框、选择框和复选框。
    - 输入时应进行实时格式验证，并显示相应的提示或错误信息。
    - 用户名输入框失去焦点时，应调用 API-GET-CheckUsername 检查用户名是否可用。
    - 点击“下一步”按钮时，应进行最终校验；校验通过后跳转到“验证码输入页”，并初始化验证码发送流程。
    - 当 isLoading 状态为 true 时，提交按钮应被禁用。
    - 注册成功后，应调用 onRegisterSuccess 回调。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于支持用户注册功能。"
    - date: "2025-12-01"
      description: "调整依赖与流程，改为经验证码页完成注册。"

- type: Frontend
  id: UI-TermsPage
  description: 《中国铁路客户服务中心网站服务条款》页面容器。
  properties: []
  state: []
  dependencies:
    - UI-TopNavigationBar
    - UI-QuickAccessMenu
  acceptanceCriteria:
    - 页面布局与首页一致，上中为导航与快捷入口，下方为条款文本，标题“服务条款”居中显示。
  changeLog:
    - date: "2025-12-01"
      description: "新增以满足注册页条款链接跳转。"

- type: Frontend
  id: UI-PrivacyPolicyPage
  description: 《隐私权政策》页面容器。
  properties: []
  state: []
  dependencies:
    - UI-TopNavigationBar
    - UI-QuickAccessMenu
  acceptanceCriteria:
    - 页面布局与首页一致，下方为政策文本；中文标题“隐私权政策”和英文标题“NOTICE”居中显示。
  changeLog:
    - date: "2025-12-01"
      description: "新增以满足注册页隐私政策链接跳转。"

- type: Frontend
  id: UI-RegisterVerificationPage
  description: 注册验证码输入页，包含自动发送、倒计时、重新发送与下一步校验逻辑。
  properties: []
  state:
    - code
    - countdown
    - sendButtonState
    - error
  dependencies:
    - API-POST-Register-SendCode
    - API-POST-Register-Verify
  acceptanceCriteria:
    - 页面加载时自动向注册手机号发送6位验证码并开始60秒倒计时，按钮不可点击。
    - 倒计时结束后按钮变为可点击，点击后重新发送验证码并重置倒计时。
    - 未输入验证码点击“下一步”显示“❌请输入验证码”；错误验证码显示“❌验证码错误，请重新输入”。
    - 验证通过后跳转至“注册成功页”。
  changeLog:
    - date: "2025-12-01"
      description: "新增以满足注册验证码流程页面。"

- type: Frontend
  id: UI-RegisterSuccessPage
  description: 注册成功页，展示成功文案与登录按钮。
  properties: []
  state: []
  dependencies:
    - UI-TopNavigationBar
    - UI-QuickAccessMenu
  acceptanceCriteria:
    - 显示“恭喜您，注册成功！”文案；点击“登录”按钮跳转至登录页。
  changeLog:
    - date: "2025-12-01"
      description: "新增以满足注册成功页面交互。"

- type: Frontend
  id: UI-LoginPage
  description: 登录页页面容器，包含顶部导航、登录表单区域与底部宣传栏。
  properties: []
  state: []
  dependencies:
    - UI-TopNavigationBar
    - UI-QuickAccessMenu
    - UI-LoginForm
  acceptanceCriteria:
    - 整体页面背景为白色，分上、中、下三部分布局，尺寸固定。
    - 顶部导航栏左侧为logo区域，右侧为“欢迎登录12306”标语。
    - 登录表单区域背景为推广图片，表单位于背景偏右位置。
    - 底部宣传栏左侧显示“友情链接”，右侧显示官方平台二维码。
    - 点击顶部导航栏logo应跳转到首页。
  changeLog:
    - date: "2025-11-24"
      description: "新增，用于承载登录页整体布局与跳转。"

- type: Frontend
  id: UI-LoginForm
  description: 登录表单组件，处理输入、校验及短信验证流程的触发。
  properties:
    - name: onLoginSuccess
      type: function
      description: "登录成功后的回调函数。"
  state:
    - identifier
    - password
    - error
    - isLoading
    - showSmsModal
  dependencies:
    - API-POST-Login-SendCode
    - UI-SMSVerificationModal
  acceptanceCriteria:
    - 初始状态下，用户名/邮箱/手机号、密码输入框均为空，并显示灰字提示。
    - 未输入用户名时点击“立即登录”，显示“❗请输入用户名！”。
    - 未输入密码时点击“立即登录”，显示“❗请输入密码！”。
    - 输入密码长度小于6位时，点击“立即登录”，显示“❗密码长度不能小于6位！”。
    - 当输入合法时，弹出短信验证弹窗。
    - 点击“注册12306账户”入口，应跳转到注册页面。
    - 点击“忘记密码？”入口，应跳转到忘记密码页面。
  changeLog:
    - date: "2025-11-24"
      description: "新增，用于实现登录表单交互与校验。"

- type: Frontend
  id: UI-SMSVerificationModal
  description: 短信验证弹窗组件，包含证件号后4位与验证码输入、获取验证码与确定流程。
  properties:
    - name: onClose
      type: function
      description: "关闭弹窗的回调。"
    - name: onVerified
      type: function
      description: "短信验证与密码校验成功后的回调。"
  state:
    - idLast4
    - code
    - sendButtonState
    - countdown
    - error
  dependencies:
    - API-POST-Login-SendCode
    - API-POST-Login-Verify
  acceptanceCriteria:
    - 弹窗初始化时，两个输入框为空，分别显示灰字提示。
    - “获取验证码”按钮有初始化、可点击与倒计时三种状态。
    - 点击“获取验证码”后，系统判定identifier类型；用户不存在或证件后4位不匹配时，显示“请输入正确的用户信息！”。
    - 匹配成功时发送6位验证码，显示“获取手机验证码成功！”，并记录到数据库。
    - 未填写验证码点击“确定”时，显示“请输入验证码”。
    - 验证码长度不符合规范时，显示“请输入正确验证码”。
    - 未发送或验证码错误时，显示“验证码校验失败”。
    - 验证码正确但密码错误时，显示“用户名或密码错误”。
    - 验证成功与密码正确后，触发onVerified，并跳转到个人中心页。
    - 倒计时归零后，“重新发送验证码”按钮恢复可点击，并可重新发送验证码。
  changeLog:
    - date: "2025-11-24"
      description: "新增，用于实现登录页短信验证流程。"

- type: Frontend
  id: UI-ForgotPasswordPage
  description: 忘记密码页面容器，占位以支持登录页跳转。
  properties: []
  state: []
