- type: Database
  id: DB-FindAllStations
  description: 从数据库中查询所有火车站信息。
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，应返回包含所有站点名称和拼音的列表。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建，用于支持首页出发地和到达地的站点推荐。"

- type: Database
  id: DB-FindTrains
  description: 按条件查询车次列表，支持分页与多条件筛选（AND）。
  dependencies:
    - none
  acceptanceCriteria:
    - 必填参数：from（出发地）、to（到达地）、date（出发日期）。
    - 可选筛选：trainTypes（GC/D/Z）、departureStation、arrivalStation、seatTypes、departureTimeStart、departureTimeEnd、passengerCategory(normal/student)。
    - 支持分页：page（默认1）、pageSize（默认20），返回总记录数与分页元数据。
    - 排序支持：sortBy(trainNumber|departureTime|arrivalTime|duration)、sortOrder(asc|desc)。
    - 查询需命中索引（trainNumber、date、from+to组合、departureTime、arrivalTime、duration），以满足P99≤500ms。
    - 当命中缓存时，优先返回Redis缓存（TTL 900s），座位状态更新时应失效对应缓存键。
    - 如果没有匹配的车次，返回空items与total=0。
  changeLog:
    - date: "2025-11-17"
      description: "初始创建，用于支持车票查询功能。"
    - date: "2025-12-07"
      description: "扩展分页与筛选项，增加性能与缓存要求。"
    - date: "2025-12-07"
      description: "新增乘客类别筛选与排序支持。"

- type: Database
  id: DB-FindUserByUsername
  description: 根据用户名在数据库中查找用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 如果找到用户，返回用户信息。
    - 如果未找到用户，返回null。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于注册时检查用户名是否被占用。"

- type: Database
  id: DB-FindUserByIdentity
  description: 根据证件类型和证件号码在数据库中查找用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 如果找到用户，返回用户信息。
    - 如果未找到用户，返回null。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于注册时检查证件号码是否已被注册。"

- type: Database
  id: DB-FindUserByEmail
  description: 根据邮箱在数据库中查找用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 如果找到用户，返回用户信息。
    - 如果未找到用户，返回null。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于注册时检查邮箱是否已被注册。"

- type: Database
  id: DB-FindUserByPhone
  description: 根据手机号码在数据库中查找用户。
  dependencies:
    - none
  acceptanceCriteria:
    - 如果找到用户，返回用户信息。
    - 如果未找到用户，返回null。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于注册时检查手机号码是否已被注册。"

- type: Database
  id: DB-CreateUser
  description: 在数据库中创建一条新的用户记录。
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，users表中会增加一条新记录。
    - 如果用户名、证件、邮箱或手机号已存在，操作应失败并抛出唯一性约束错误。
    - 初始写入包含：username、password、fullName、identityType、identityNumber、passengerType、email(可为空)、phoneNumber。
    - 其它信息（如乘车人信息、本人车票信息）初始化为空或NULL，供后续页面写入。
  changeLog:
    - date: "2025-11-23"
      description: "创建，用于用户注册。"
    - date: "2025-12-01"
      description: "更新验收标准，明确基础信息写入与其它信息初始化为空。"

- type: Database
  id: DB-CreateLoginCodeRecord
  description: 记录短信验证码（登录/注册/忘记密码）及其关联手机号或标识符。
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，login_codes表新增一条包含phone或identifier、code、createdAt、valid的记录。
  changeLog:
    - date: "2025-11-24"
      description: "新增，用于登录流程中记录短信验证码。"
    - date: "2025-12-01"
      description: "扩展适用范围至注册与忘记密码流程，并补充valid字段。"

- type: Database
  id: DB-FindLoginCodeRecord
  description: 根据手机号或标识符查询最近一次短信验证码记录（登录/注册/忘记密码）。
  dependencies:
    - none
  acceptanceCriteria:
    - 找到记录时返回验证码记录（包含code与创建时间）。
    - 未找到记录时返回null。
  changeLog:
    - date: "2025-11-24"
      description: "新增，用于登录流程中校验短信验证码。"
    - date: "2025-12-01"
      description: "扩展至注册与忘记密码场景。"

- type: Database
  id: DB-InvalidateLoginCodeRecord
  description: 作废已使用或过期的短信验证码记录（登录/注册/忘记密码）。
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，对应验证码记录被标记为失效，后续校验应失败。
  changeLog:
    - date: "2025-11-24"
      description: "新增，用于登录流程中验证码的生命周期管理。"
    - date: "2025-12-01"
      description: "扩展至注册与忘记密码场景。"

- type: Database
  id: DB-DefineTrainSchema
  description: 定义车票数据库的列车与线路相关数据模型。
  dependencies:
    - none
  acceptanceCriteria:
    - 列车模型包含：trainNumber(string, unique, indexed)、trainType(enum: G/D/Z/other)、routeStations(array<stationId>)、departureStation(stationId)、arrivalStation(stationId)。
    - 时刻信息：departureTime(datetime, indexed)、arrivalTime(datetime, indexed)、duration(minutes, indexed)、arrivalDayIndicator(enum: sameDay/nextDay)。
    - 全量时刻表：stationSchedules(array<{stationId, arrivalTime(datetime|nullable), departureTime(datetime|nullable), segmentId, dwellMinutes(int>=0)}>)，站序与时间一致性校验。
    - 车厢与座席：coaches(array<coach>)，coach包含coachNo、seatType(enum: 一等座/二等座/软卧/硬卧/软座/硬座/无座)、seats(array<seat>)；seat包含seatNo、statusBySegment(map<segmentId, enum: 空闲/已被预定>)。
    - 价格：segmentFare(map<segmentId, number>=0)，总票价为出发-到达区间的segmentFare之和。
    - 约束：所有引用的stationId须存在于站点表；trainNumber唯一；时间与站序一致性校验；stationSchedules 覆盖 routeStations。
  changeLog:
    - date: "2025-12-07"
      description: "新增以覆盖车次列表页的数据实体定义。"
    - date: "2025-12-07"
      description: "补充全量时刻表结构与索引字段以支持新接口。"

- type: Database
  id: DB-DefineStationSchema
  description: 定义站点数据模型与约束。
  dependencies:
    - none
  acceptanceCriteria:
    - 站点模型包含：stationId(uuid)、name(string, unique)、pinyin(string, indexed)、city(string, optional)。
    - 约束：name唯一；pinyin支持模糊检索；与列车routeStations建立引用关系。
  changeLog:
    - date: "2025-12-07"
      description: "新增以支持站点选择与检索。"

- type: Database
  id: DB-ImportTrainInfoFromJSON
  description: 从“车次信息.json”导入车次基础数据至数据库。
  dependencies:
    - DB-DefineTrainSchema
    - DB-DefineStationSchema
  acceptanceCriteria:
    - 成功导入有效JSON记录；无效记录被跳过并记录日志。
    - 导入后建立必要索引；保持trainNumber唯一性与引用完整性。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足数据初始化来源。"

- type: Database
  id: DB-CreateIndexes-Trains
  description: 为常用查询字段创建索引以提升查询性能。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 在trainNumber、date、departureTime、arrivalTime、duration、from+to组合上建立B+树或哈希索引。
    - 索引统计信息定期更新；高并发场景P99≤500ms。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足性能优化要求。"
    - date: "2025-12-07"
      description: "扩展索引列以支持排序字段。"

- type: Database
  id: DB-GetTrainSchedule
  description: 根据车次号与日期返回该车次的全量站序时刻表。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 输入：trainNumber(string, required)、date(date, optional)。
    - 输出：stationSchedules数组，元素包含stationId、arrivalTime、departureTime、segmentId、dwellMinutes。
    - 当车次不存在时返回空数组；当日期为空时返回最新时刻表版本。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足车次时刻表展示需求。"

- type: Database
  id: DB-GetStationsGrouped
  description: 返回站点分组数据（热门与按首字母分组）。
  dependencies:
    - DB-DefineStationSchema
  acceptanceCriteria:
    - 输出包含groups数组：如“热门”、“ABCDE”、“FGHIJ”、“KLMNO”、“PQRST”、“UVWXYZ”，每组含站点列表。
    - “热门”来源于近N天点击/查询量TOP列表或预设；字母分组基于pinyin首字母范围。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足站点下拉的分组展示。"

- type: Database
  id: DB-FindTrainsRoundTrip
  description: 同时查询去程与返程车次列表，分别分页返回。
  dependencies:
    - DB-FindTrains
  acceptanceCriteria:
    - 输入：from(string)、to(string)、departDate(date)、returnDate(date)、共享筛选与排序参数；均必填除筛选项。
    - 输出：outbound与return两个结果集，各含items与分页元数据。
    - 任一方向缺失参数返回错误；当结果为空时对应items为空、total=0。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足双程查询场景。"

- type: Database
  id: DB-Cache-TrainsQueryResults
  description: 使用Redis对车次查询结果进行缓存，TTL 900秒。
  dependencies:
    - DB-FindTrains
  acceptanceCriteria:
    - 缓存键包含筛选条件摘要（from、to、date、filters、page、pageSize）。
    - 命中缓存直接返回；发生座位状态更新或列车增删时，应失效相关键。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足缓存层设计。"

- type: Database
  id: DB-GetRemainingTickets
  description: 计算指定区间与席别的余票数量（以座位为单位）。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 相邻两站：直接统计该席别在相邻站段的空闲座位数并返回。
    - 非相邻区间：仅当某座位在出发-到达全区间均为空闲时计数+1；遍历所有相关车厢座位后返回。
    - 当所有座位在任意中途区间为已被预定时，该席别余票=0。
    - 统计单位为“座位”，任何跨段拼接不得计为1。
  changeLog:
    - date: "2025-12-07"
      description: "新增以匹配余票计算规则。"

- type: Database
  id: DB-CalculateTicketPrice
  description: 计算出发-到达区间的票价（席别维度）。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 票价=所有途经相邻站段该席别的价格之和；结果为非负数。
  changeLog:
    - date: "2025-12-07"
      description: "新增以覆盖票价计算规则。"

- type: Database
  id: DB-CalculateRefundFee
  description: 根据退票时间与票面价格计算退票手续费及应退金额。
  dependencies:
    - DB-GetOrderDetails
  acceptanceCriteria:
    - 输入：ticketPrice(票面原价，元，number>=0)、departureDateTime(datetime)、refundRequestedAt(datetime)。
    - 若 refundRequestedAt 在 departureDateTime 前8天（含）以上，不收取退票费，fee=0，refundAmount=ticketPrice，feeRate=0%。
    - 若在开车时间前48小时（含）以上但不足8天，按票价5%计退票费；前24小时（含）以上但不足48小时按票价10%计；不足24小时按票价20%计。
    - 手续费计算尾数以0.5元为单位：尾数小于2.5角舍去；2.5角（含）以上且小于7.5角计为0.5元；7.5角（含）以上进为1元。
    - 手续费最低按2元计收（当fee>0时）；计算后返回 fee（手续费）、feeRate（费率百分比）、refundAmount（应退票款，保留一位小数）。
  changeLog:
    - date: "2026-01-15"
      description: "新增，用于实现退票手续费与应退金额的统一计算规则。"

- type: Database
  id: DB-UpdateSeatStatusOnReservation
  description: 预定成功后，更新对应车次/车厢/座位在相关站段的座位状态为“已被预定”。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 正确更新座位在出发-到达区间内所有相邻站段的状态为已被预定；写入事务成功且可回滚。
    - 触发缓存失效，影响到相关查询键。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足数据库更新与维护要求。"

- type: Database
  id: DB-ManageTrainSchedule
  description: 支持新车次加入与已有车次删除的维护操作。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 新增时校验唯一性与完整性；删除时级联清理相关座位与价格段数据。
    - 操作完成后更新索引与缓存失效。
  changeLog:
    - date: "2025-12-07"
      description: "新增以满足数据库的更新与维护。"

- type: Database
  id: DB-FindPassengersByUserId
  description: 查询指定用户的乘车人列表。
  dependencies:
    - none
  acceptanceCriteria:
    - 返回该userId下的所有乘车人。
  changeLog:
    - date: "2025-12-16"
      description: "新增，用于乘车人列表。"

- type: Database
  id: DB-CreatePassenger
  description: 创建乘车人。
  dependencies:
    - none
  acceptanceCriteria:
    - 校验唯一性（userId + idNumber）。
    - 插入记录。
  changeLog:
    - date: "2025-12-16"
      description: "新增，用于添加乘车人。"

- type: Database
  id: DB-UpdatePassenger
  description: 更新乘车人信息。
  dependencies:
    - none
  acceptanceCriteria:
    - 更新指定ID的记录。
  changeLog:
    - date: "2025-12-16"
      description: "新增，用于修改乘车人。"

- type: Database
  id: DB-DeletePassengers
  description: 删除乘车人。
  dependencies:
    - none
  acceptanceCriteria:
    - 物理删除或逻辑删除（这里假设物理删除）。
    - 只能删除指定userId下的记录。
  changeLog:
    - date: "2025-12-16"
      description: "新增，用于删除乘车人。"

- type: Database
  id: DB-CreateOrder
  description: 在数据库中创建一个新的订单记录。
  dependencies:
    - none
  acceptanceCriteria:
    - 成功执行后，orders 表中会增加一条新记录。
    - 包含：userId, trainId, fromStationId, toStationId, passengers(JSON/关联表), totalAmount, status('待确认'/'待支付'/'已支付'/'已取消'), createdAt, expireAt(20分钟后)。
    - 关联记录包含每个乘车人的具体席位号（由锁定席位逻辑生成）。
    - 生成订单号：orderNo 以 "EX" 开头 + 9位数字，系统保证唯一且建立唯一索引。
  changeLog:
    - date: "2025-12-24"
      description: "依据订单填写页需求新增。"
    - date: "2025-12-24"
      description: "细化关联记录与席位号要求。"
    - date: "2025-12-27"
      description: "增加订单号生成规则与唯一性约束。"

- type: Database
  id: DB-GetOrderDetails
  description: 获取订单详细信息。
  dependencies:
    - none
  acceptanceCriteria:
    - 返回订单完整信息，包括列车详情、乘车人详情、席位与价格。
    - 返回字段应包含 orderNo，用于支付成功页展示（格式同 DB-CreateOrder 定义）。
  changeLog:
    - date: "2025-12-24"
      description: "依据订单确认页需求新增。"
    - date: "2025-12-27"
      description: "补充返回字段包含 orderNo。"

- type: Database
  id: DB-UpdateOrderStatus
  description: 更新订单状态。
  dependencies:
    - none
  acceptanceCriteria:
    - 更新订单状态为指定值（如 '待支付'、'已支付'、'已取消'、'已退票'）。
    - 当状态更新为“已退票”时，应同时写入或更新退款相关字段（refundFee、refundAmount、refundRate）以及状态更新时间戳。
    - 只能更新当前登录用户所属的订单记录。
  changeLog:
    - date: "2025-12-24"
      description: "依据订单确认与取消需求新增。"
    - date: "2026-01-15"
      description: "扩展状态枚举以支持退票，并补充退款字段写入要求。"

- type: Database
  id: DB-LockSeats
  description: 锁定席位，减少可用票数。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 对应车次、日期、区间的指定席别票数减少 N。
    - 操作需在事务中执行，确保原子性。
  changeLog:
    - date: "2025-12-24"
      description: "依据订单提交锁定席位需求新增。"

- type: Database
  id: DB-ReleaseSeats
  description: 释放席位，恢复可用票数。
  dependencies:
    - DB-DefineTrainSchema
  acceptanceCriteria:
    - 对应车次、日期、区间的指定席别票数增加 N。
    - 用于订单取消、支付超时或退票场景释放席位。
  changeLog:
    - date: "2025-12-24"
      description: "依据订单取消或超时释放席位需求新增。"
    - date: "2026-01-15"
      description: "补充退票场景下的席位释放用途。"

- type: Database
  id: DB-ListUserOrdersByStatus
  description: 按状态返回指定用户的订单列表，用于个人中心订单展示。
  dependencies:
    - none
  acceptanceCriteria:
    - 输入：userId(required)、status(enum: 待支付/已支付/已退票)、page(optional, default 1)、pageSize(optional, default 20)。
    - 输出：items 数组与分页元数据；每条记录包含 orderId、orderNo、trainNumber、departureStation、arrivalStation、seatInfo(每人席别/车厢/席位号)、totalAmount、status。
    - 当无记录时返回 items 空数组、total=0。
    - 当订单状态为“已退票”时，status 字段应返回“已退票”，并包含该订单的票价、退票手续费与应退金额等字段，以供前端以灰色样式展示。
  changeLog:
    - date: "2025-12-27"
      description: "新增，用于个人中心订单列表按状态查询。"
    - date: "2026-01-15"
      description: "扩展状态枚举以支持已退票订单展示，并补充退款字段返回要求。"
